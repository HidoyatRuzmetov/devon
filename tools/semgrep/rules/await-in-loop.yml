# HARDENING H29.1 / TECH-SPEC §16 "no await in a loop over independent items". `p/owasp-top-ten`
# (wired in tools/security/scan.mjs) has no rule for this -- it is a performance/scalability
# footgun (H8, H29), not a vulnerability class, so it lives here instead.
#
# This flags the SHAPE (await inside a loop body) -- it cannot know whether a given loop's iterations
# are independent (parallelisable with Promise.all) or a genuine sequential dependency (each step
# needs the previous one's result), which is exactly why HARDENING phrases it as a review item, not a
# blanket ban: a human (or a verifier citing H29.1) reads the match and either fixes it
# (Promise.all/pMap) or leaves a comment explaining the real dependency, same convention this repo
# already uses everywhere else for a deliberate exception.
rules:
  - id: devon-await-in-for-loop
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      await inside a `for`/`for-of` loop body -- HARDENING H29.1. If each iteration is independent
      (fetching/updating unrelated rows, calling an unrelated service per item), batch with
      `Promise.all(items.map(...))` or a bounded-concurrency mapper instead of awaiting one at a time.
      If iterations truly depend on each other in sequence, leave a comment saying so and this match
      is a false positive, not a violation.
    patterns:
      - pattern-either:
          - pattern: |
              for (...) {
                ...
                await $CALL(...)
                ...
              }
          - pattern: |
              for (const $ITEM of $LIST) {
                ...
                await $CALL(...)
                ...
              }
          - pattern: |
              for (const $ITEM in $LIST) {
                ...
                await $CALL(...)
                ...
              }
      # Promise.all(...)/Promise.allSettled(...) themselves are the correct pattern, not a violation
      # -- exclude a loop whose only await targets one of those (a batching loop building up promises
      # is fine; awaiting *inside* the per-item body sequentially is the thing being flagged).
      - pattern-not: |
          for (...) {
            ...
            await Promise.all(...)
            ...
          }
      - pattern-not: |
          for (...) {
            ...
            await Promise.allSettled(...)
            ...
          }
    paths:
      include:
        - apps/api/src/**
        - apps/web/src/**
        - packages/*/src/**
      exclude:
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/test/**"
        # --- reviewed while building this rule (ops-tooling package, 2026-09-08) -- FALSE POSITIVES: a
        #     retry-with-backoff loop (H8.1 itself *requires* this shape: "bounded retries ... with
        #     backoff"), a migration runner (migrations MUST apply in order, one at a time, by
        #     definition), a dynamic-module-registration loop (plugin load order matters at boot, not a
        #     per-request path), or a one-time seed/demo script whose iterations share a transaction and
        #     RLS session context set per-iteration (`asUser`/`asDepartment` -- genuinely sequential,
        #     not parallelisable without breaking the RLS GUC the next query depends on). None of these
        #     are the "independent items" shape H29.1 means to catch.
        - apps/api/src/module-loader.ts
        - packages/db/src/seed/module-loader.ts
        - packages/db/src/migrate.ts
        - packages/ai/src/glm-provider.ts # transport-retry loop
        - packages/ai/src/gateway.ts # provider-call-retry loop
        - packages/db/src/seed/**
        # --- reviewed while building this rule -- REAL findings, left in the codebase because fixing
        #     them means editing apps/api/src/packages/db/packages/ai, out of this package's edit scope
        #     (ops-tooling touches infra/tools/docs/scripts only). Listed in full in
        #     agentic/ledger/hardening/2026-09-08T06-45-00-05-00/ops-tooling.md's H29 section so a
        #     follow-up package picks them up; a NEW occurrence anywhere else still fails this gate.
        - apps/api/src/modules/admin/repo.ts
        - apps/api/src/modules/analytics/aggregate.ts
        - apps/api/src/modules/events/reminder-worker.ts
        - apps/api/src/modules/events/service.ts
        - apps/api/src/modules/notifications/events.ts
        - apps/api/src/modules/notifications/jobs.ts
        - apps/api/src/modules/notifications/repo.ts
        - apps/api/src/modules/pages/onboarding.ts
        - apps/api/src/modules/projects/repo.ts
        - apps/api/src/modules/work/link-unfurl.ts
        - packages/db/src/events-worker.ts
