# Devon (WorkPortal) -- static SPA server for the `web` Compose service (H17/H18). Loaded by
# apps/web/Dockerfile's runtime stage into nginxinc/nginx-unprivileged, which already listens on an
# unprivileged port as a non-root user -- 8080 here, matching infra/Caddyfile's `reverse_proxy
# web:8080` and this image's `EXPOSE 8080`.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy (infra/Caddyfile) already forces HTTPS, sets HSTS/CSP/frame-ancestors and terminates TLS
    # for the whole app (H1.10) -- this server only ever receives already-proxied, already-internal
    # traffic on the `devon` network, so it does not repeat those headers.

    # Fingerprinted build output (H6.3): Vite's `assets/*-<hash>.{js,css,...}` is immutable by
    # construction -- a content change always produces a new filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # `index.html` itself must never be cached (H2.5 pattern applied to the shell): it is the only
    # file whose content can change without its name changing (a new deploy re-points its asset
    # hashes), so a stale cached copy would keep loading yesterday's JS/CSS forever.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback: every non-file route (client-side router paths) resolves to the shell, which then
    # renders the real not-found state client-side rather than a bare nginx 404 (design.md states
    # table).
    location / {
        try_files $uri /index.html;
    }

    # H6.3 "source maps not public (uploaded to error tracking only)": `apps/web/src/vite.config.ts`
    # sets `sourcemap: command === 'build'`, so every production build emits a `*.map` next to each
    # bundled `.js`/`.css` file, and `apps/web/Dockerfile`'s `COPY --from=build /repo/apps/web/dist
    # /usr/share/nginx/html` copies the whole directory -- maps included -- into this image. Disabling
    # sourcemap generation, or writing it outside `dist/`, is an `apps/web/src` change (out of this
    # package's edit scope: ops-tooling touches infra/, tools/, docs/ops/, Dockerfiles, scripts/, not
    # application source) -- blocking the request path here is the fix available at this layer, and is
    # sufficient on its own: the maps still exist on disk inside the image/build output for a real
    # error-tracking upload step to pick up, they are simply never reachable over HTTP.
    location ~* \.map$ {
        deny all;
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    server_tokens off;
}
