# k3s ships Traefik as its default ingress controller, so this is a plain Ingress with Traefik
# annotations -- no extra component to install. cert-manager issues the certificate (see
# optional/cert-manager-issuer.yaml); on an air-gapped ministry network where ACME cannot reach
# Let's Encrypt, delete the cert-manager annotation and create the TLS secret by hand from the
# ministry CA's PEM files:
#
#   kubectl -n devon create secret tls devon-tls --cert=fullchain.pem --key=privkey.pem
#
# Routing mirrors infra/Caddyfile exactly, and the order matters -- Traefik matches the longest
# path prefix, so /api, /healthz, /readyz and /realtime win over the catch-all "/" to the SPA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devon
  namespace: devon
  labels: { app.kubernetes.io/part-of: devon }
  annotations:
    cert-manager.io/cluster-issuer: devon-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    # Security headers + the SPA's CSP, the same policy infra/Caddyfile serves. Traefik applies them
    # through this middleware (namespace-name@kubernetescrd is Traefik's own naming convention).
    traefik.ingress.kubernetes.io/router.middlewares: devon-devon-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: ['work.example.ministry.uz']
      secretName: devon-tls
  rules:
    - host: work.example.ministry.uz
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: devon-api, port: { number: 3000 } } }
          - path: /healthz
            pathType: Prefix
            backend: { service: { name: devon-api, port: { number: 3000 } } }
          - path: /readyz
            pathType: Prefix
            backend: { service: { name: devon-api, port: { number: 3000 } } }
          - path: /realtime
            pathType: Prefix
            backend: { service: { name: devon-centrifugo, port: { number: 8000 } } }
          # Only when STORAGE_S3_PUBLIC_ENDPOINT points here: the browser PUTs avatar bytes straight
          # to a presigned URL on this origin, and the signature covers the host.
          - path: /objects
            pathType: Prefix
            backend: { service: { name: devon-minio, port: { number: 9000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: devon-web, port: { number: 8080 } } }
