# MinIO: avatars and attachments (STORAGE_DRIVER=s3). One replica on a PVC -- the same single-node
# caveat as Postgres. A ministry that already runs S3-compatible storage deletes this file from
# kustomization.yaml and points STORAGE_S3_* at it instead.
apiVersion: v1
kind: Service
metadata:
  name: devon-minio
  namespace: devon
  labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: devon }
spec:
  selector: { app.kubernetes.io/name: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devon-minio
  namespace: devon
  labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: devon }
spec:
  serviceName: devon-minio
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: minio }
  template:
    metadata:
      labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: devon }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-08T15-41-24Z@sha256:8834ae47a2de3509b83e0e70da9369c24bbbc22de42f2a2eddc530eee88acd1b
          args: ['server', '/data', '--console-address', ':9001']
          envFrom:
            - secretRef: { name: devon-secrets }
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ['ALL'] }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 50Gi
