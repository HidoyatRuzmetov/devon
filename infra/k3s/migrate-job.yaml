# Migrations run BEFORE the new api/worker pods start, never inside them (H18.1, TECH-SPEC §16).
# Every migration in this project is expand-then-contract (I-15), so the OLD api code keeps working
# against the NEW schema for the length of the rollout -- which is exactly what makes "migrate, then
# roll" safe without downtime.
#
# This Job is NOT part of kustomization.yaml on purpose: a Job's pod template is immutable, so
# `kubectl apply` of the same Job name fails on the second release. Run it per release instead:
#
#   kubectl -n devon delete job devon-migrate --ignore-not-found
#   kubectl -n devon apply -f infra/k3s/migrate-job.yaml
#   kubectl -n devon wait --for=condition=complete job/devon-migrate --timeout=10m
#
# scripts/update.sh does exactly that, in that order, and refuses to roll out if the Job fails.
apiVersion: batch/v1
kind: Job
metadata:
  name: devon-migrate
  namespace: devon
  labels: { app.kubernetes.io/name: migrate, app.kubernetes.io/part-of: devon }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: migrate, app.kubernetes.io/part-of: devon }
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: devon-api:local
          command: ['pnpm', '--filter', '@devon/db', 'migrate:apply']
          envFrom:
            - configMapRef: { name: devon-config }
            - secretRef: { name: devon-secrets }
          env:
            # The migrator connects as the Postgres SUPERUSER, not devon_app: migration 0001_roles.sql
            # CREATEs the devon_migrator and devon_app roles, so the connection that applies it cannot
            # itself authenticate as a role that does not exist yet on a fresh database.
            - name: MIGRATION_DATABASE_URL
              value: postgres://postgres:$(POSTGRES_SUPERUSER_PASSWORD)@devon-postgres:5432/$(POSTGRES_DB) # $(NAME) is a placeholder kubelet expands from this container's own env
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_APP_USER):$(POSTGRES_APP_PASSWORD)@devon-postgres:5432/$(POSTGRES_DB) # $(NAME) is a placeholder kubelet expands from this container's own env
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ['ALL'] }
