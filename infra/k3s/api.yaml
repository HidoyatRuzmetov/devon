apiVersion: v1
kind: Service
metadata:
  name: devon-api
  namespace: devon
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: devon }
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devon-api
  namespace: devon
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: devon }
spec:
  # Safe to raise (H12.1: sessions live in Postgres/Valkey, not in process -- ADR-003). Raise it
  # only after the api image has a SIGTERM drain, or a rollout cuts in-flight requests instead of
  # finishing them (docs/ops/DEPLOY.md §7).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: devon }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: devon-api:local
          envFrom:
            - configMapRef: { name: devon-config }
            - secretRef: { name: devon-secrets }
          env:
            # Assembled here rather than stored as a secret of its own, so the password exists in
            # exactly one place and cannot drift out of sync with the Postgres role. Kubernetes
            # expands $(VAR) against other env vars of this same container.
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_APP_USER):$(POSTGRES_APP_PASSWORD)@devon-postgres:5432/$(POSTGRES_DB) # $(NAME) is a placeholder kubelet expands from this container's own env
          ports:
            - { name: http, containerPort: 3000 }
          # /healthz says the process is alive; /readyz additionally says the database is reachable
          # and every migration is applied. Liveness must use the cheap one -- a database blip would
          # otherwise restart-loop every replica -- and readiness must use the strict one, so traffic
          # is only ever routed to a replica that can actually answer.
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: '2', memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # STORAGE_DRIVER=local would write under .data/storage
            capabilities: { drop: ['ALL'] }
      terminationGracePeriodSeconds: 30
