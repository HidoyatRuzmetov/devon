# Valkey: sessions cache, rate limits, Centrifugo's broker. Holds nothing durable (ADR-003 makes
# Postgres the sole revocation record), so it runs with persistence off and an emptyDir -- losing it
# costs a cache warm-up, never data.
apiVersion: v1
kind: Service
metadata:
  name: devon-valkey
  namespace: devon
  labels: { app.kubernetes.io/name: valkey, app.kubernetes.io/part-of: devon }
spec:
  selector: { app.kubernetes.io/name: valkey }
  ports:
    - { name: valkey, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devon-valkey
  namespace: devon
  labels: { app.kubernetes.io/name: valkey, app.kubernetes.io/part-of: devon }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: valkey }
  template:
    metadata:
      labels: { app.kubernetes.io/name: valkey, app.kubernetes.io/part-of: devon }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine@sha256:cfb2aa4c8352930130fd45eb231a57310ac326d7323edae12b384b9270c46dda
          args: ['valkey-server', '--save', '', '--appendonly', 'no']
          ports:
            - { name: valkey, containerPort: 6379 }
          readinessProbe:
            exec: { command: ['valkey-cli', 'ping'] }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
