# Copy to secret.yaml, fill in real values, apply it, and NEVER commit it (I-17, H1.1).
# `infra/k3s/.gitignore` already excludes secret.yaml; the safest habit is still to generate it
# rather than edit it:
#
#   kubectl -n devon create secret generic devon-secrets \
#     --from-literal=POSTGRES_SUPERUSER_PASSWORD="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_APP_PASSWORD="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_MIGRATOR_PASSWORD="$(openssl rand -hex 32)" \
#     --from-literal=CSRF_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=MINIO_ROOT_USER=devon \
#     --from-literal=MINIO_ROOT_PASSWORD="$(openssl rand -hex 32)" \
#     --from-literal=CENTRIFUGO_API_KEY="$(openssl rand -hex 32)" \
#     --from-literal=CENTRIFUGO_TOKEN_HMAC_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=AI_API_KEY='<the GLM key from the ministry GPU cluster>' \
#     --dry-run=client -o yaml > infra/k3s/secret.yaml
#
# DATABASE_URL is assembled from the pieces above by the api/worker Deployments, so it is not a
# separate secret to keep in sync.
apiVersion: v1
kind: Secret
metadata:
  name: devon-secrets
  namespace: devon
type: Opaque
stringData:
  POSTGRES_SUPERUSER_PASSWORD: <replace-me>
  POSTGRES_APP_PASSWORD: <replace-me>
  POSTGRES_MIGRATOR_PASSWORD: <replace-me>
  CSRF_SECRET: <replace-me>
  MINIO_ROOT_USER: <replace-me>
  MINIO_ROOT_PASSWORD: <replace-me>
  CENTRIFUGO_API_KEY: <replace-me>
  CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: <replace-me>
  STORAGE_S3_ACCESS_KEY: <replace-me-same-as-MINIO_ROOT_USER>
  STORAGE_S3_SECRET_KEY: <replace-me-same-as-MINIO_ROOT_PASSWORD>
  # Optional. Leave these OUT entirely rather than setting them empty:
  #   AI_API_KEY -- without it packages/ai falls back to its mock provider and AI features hide.
  #   TELEGRAM_BOT_TOKEN / TELEGRAM_BOT_USERNAME / TELEGRAM_WEBHOOK_SECRET -- all three or none;
  #     apps/api refuses to boot in production with a bot token and no webhook secret (H1.14).
  #   VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY -- web push; rotating them unsubscribes every browser.
