# ClamAV. Required whenever NODE_ENV=production and uploads are enabled: apps/api refuses to boot
# with CLAMAV_MODE=off in production (config.ts, H1.8), and with CLAMAV_MODE=clamd an unreachable
# clamd fails uploads closed rather than letting an unscanned file through.
#
# Not in kustomization.yaml because it is heavy (2 GiB of RAM for the signature database) and an
# air-gapped box must mirror the freshclam feed itself before this pod is useful. Apply it with:
#   kubectl apply -f infra/k3s/optional/clamav.yaml
apiVersion: v1
kind: Service
metadata:
  name: devon-clamav
  namespace: devon
  labels: { app.kubernetes.io/name: clamav, app.kubernetes.io/part-of: devon }
spec:
  selector: { app.kubernetes.io/name: clamav }
  ports:
    - { name: clamd, port: 3310, targetPort: 3310 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devon-clamav
  namespace: devon
  labels: { app.kubernetes.io/name: clamav, app.kubernetes.io/part-of: devon }
spec:
  serviceName: devon-clamav
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: clamav }
  template:
    metadata:
      labels: { app.kubernetes.io/name: clamav, app.kubernetes.io/part-of: devon }
    spec:
      securityContext:
        fsGroup: 100
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: clamav
          securityContext:
            allowPrivilegeEscalation: false
          image: clamav/clamav:1.4@sha256:b25d9199257ae7ef45e0cc4c7eaa60ce7e5447796f0090d5ff311d1a30980cc3
          ports:
            - { name: clamd, containerPort: 3310 }
          volumeMounts:
            - { name: signatures, mountPath: /var/lib/clamav }
          readinessProbe:
            exec: { command: ['clamdcheck.sh'] }
            # The first boot downloads the whole signature database; anything less than five minutes
            # of start-up grace restart-loops the pod before it has ever been ready.
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 1Gi }
            limits: { cpu: '1', memory: 2Gi }
  volumeClaimTemplates:
    - metadata:
        name: signatures
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 5Gi
