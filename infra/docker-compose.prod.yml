# Devon (WorkPortal) -- PRODUCTION compose file (H17 build, H18 deployment; TECH-SPEC.md §13).
# Separate from infra/docker-compose.yml on purpose (`docs/ops/DEPLOY.md` has the full runbook):
#   * every core service (postgres, valkey, api, worker, web, caddy) starts unconditionally -- no
#     `profiles:` gate, because there is no "inner dev loop" here to keep lean for;
#   * `api`/`web`/`worker` run the images built from `apps/api/Dockerfile`, `apps/api/Dockerfile.
#     worker` and `apps/web/Dockerfile` -- these do not exist in the dev compose file at all;
#   * `postgres`/`valkey` publish NO host ports -- reachable only from other containers on the
#     `devon` network, unlike dev's `55432`/`56379` (a developer's psql/redis-cli convenience that a
#     production box has no reason to expose);
#   * `caddy` always forces HTTPS (infra/Caddyfile's site block auto-redirects :80 -> :443 the moment
#     a `tls` directive is present, which it always is); starts un-gated, not behind a profile;
#   * every service has an explicit resource limit, a restart policy and rotated JSON-file logging
#     (`x-logging` below), matching dev's pattern for postgres/valkey/caddy/minio/clamav and adding it
#     for api/web/worker, which dev does not run at all.
#
# Optional add-ons (`minio`, `clamav`, `centrifugo`) stay behind the SAME `profiles:` names as dev, so
# an operator opts in exactly like dev does:
#   docker compose -f infra/docker-compose.prod.yml --profile minio --profile clamav up -d
#
# Bring the whole stack up:
#   docker compose -f infra/docker-compose.prod.yml up -d
# Images are pinned by digest (H18.1); re-pin with:
#   docker buildx imagetools inspect <image>:<tag> | grep '^Digest:'
# `api`/`web`/`worker` are built locally (no registry to pin a digest against yet -- `docs/ops/
# DEPLOY.md` documents building and tagging them as part of the release step, and pinning
# `DEVON_API_IMAGE`/`DEVON_WEB_IMAGE`/`DEVON_WORKER_IMAGE` here once a registry exists).
name: devon

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "10"

# H18.1 graceful shutdown: generous headroom before Compose sends SIGKILL. NOTE (verified empirically
# building apps/api/Dockerfile): `apps/api/src/server.ts` has no SIGTERM handler today, so this grace
# period is currently unused -- the process exits immediately on SIGTERM rather than draining. Kept
# here anyway so `stop_grace_period` is already correct the day a handler lands (see apps/api/
# Dockerfile's CMD comment and agentic/ledger/hardening/2026-09-08T06-45-00-05-00/ops-tooling.md).
x-app-stop-grace: &app-stop-grace
  stop_grace_period: 30s

networks:
  devon:
    name: devon
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  minio_data:
  clamav_data:

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    container_name: devon-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in production}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required in production -- never the .env.example default}
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "pg_stat_statements.max=10000"]
    # No `ports:` -- production Postgres is reachable only from the `devon` network (H1.2 least
    # exposure). `infra/backup/*.sh` and any operator `psql` already run from a throwaway container on
    # this same network (see those scripts' own comments), so nothing needs the host port.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-devon}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    networks: [devon]

  valkey:
    image: valkey/valkey:8-alpine@sha256:cfb2aa4c8352930130fd45eb231a57310ac326d7323edae12b384b9270c46dda
    container_name: devon-valkey
    restart: unless-stopped
    logging: *default-logging
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks: [devon]

  api:
    <<: *app-stop-grace
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ${DEVON_API_IMAGE:-devon-api:local}
    container_name: devon-api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      # Never committed (H1.1); `docs/ops/DEPLOY.md` documents the exact keys, sourced from
      # `.env.example`'s names. Compose fails to start the service if this file is missing, which is
      # the point -- no accidental boot on baked-in placeholder config.
      - ../.env
    environment:
      NODE_ENV: production
      # `.env`'s `DATABASE_URL`/`POSTGRES_HOST` are written from the host process's point of view
      # (design.md convention already used by infra/backup/*.sh) -- inside this compose network the
      # right hostname is the service name, so it is fixed here rather than trusted from the file.
      DATABASE_URL: postgres://devon_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-devon}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    read_only: false # STORAGE_DRIVER=local writes under apps/api/.data/storage (owned by the image's non-root user)
    networks: [devon]

  worker:
    <<: *app-stop-grace
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.worker
    image: ${DEVON_WORKER_IMAGE:-devon-worker:local}
    container_name: devon-worker
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://devon_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-devon}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
      # H12.1 "worker horizontally scalable": `docker compose -f infra/docker-compose.prod.yml up -d
      # --scale worker=3`. Safe per apps/api/Dockerfile.worker's own comment (skip-locked / fired-guard
      # update idempotency already in the application code).
    networks: [devon]
    # No `ports:` -- Caddy never routes to `worker`; it exists purely to run the background loops with
    # its own restart/resource lifecycle, separate from the replica(s) actually serving HTTP traffic.

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: ${DEVON_WEB_IMAGE:-devon-web:local}
    container_name: devon-web
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    networks: [devon]

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: devon-caddy
    restart: unless-stopped
    logging: *default-logging
    environment:
      # A real deployment sets DEVON_PUBLIC_URL to its actual hostname and CADDY_TLS_MODE per
      # docs/ops/DEPLOY.md (ministry-issued cert vs. Caddy's offline-friendly internal CA) -- the
      # defaults below are the same air-gap-safe fallback as dev, not a production recommendation.
      DEVON_PUBLIC_URL: ${DEVON_PUBLIC_URL:?DEVON_PUBLIC_URL is required in production (the real hostname, not localhost)}
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:-internal}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./maintenance:/srv/maintenance:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    networks: [devon]

  # --- Optional add-ons: same `profiles:` names as infra/docker-compose.yml, opt-in the same way. ----

  minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z@sha256:8834ae47a2de3509b83e0e70da9369c24bbbc22de42f2a2eddc530eee88acd1b
    container_name: devon-minio
    restart: unless-stopped
    logging: *default-logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required -- never the .env.example default}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks: [devon]

  clamav:
    profiles: ["clamav"]
    image: clamav/clamav:1.4@sha256:b25d9199257ae7ef45e0cc4c7eaa60ce7e5447796f0090d5ff311d1a30980cc3
    container_name: devon-clamav
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2g
    networks: [devon]

  centrifugo:
    profiles: ["centrifugo"]
    image: centrifugo/centrifugo:v6@sha256:017d0a3d39757f94a09efa657b6ad7e68222564dd9ba7dd7193981d75cd8a025
    container_name: devon-centrifugo
    restart: unless-stopped
    logging: *default-logging
    command: ["centrifugo"]
    environment:
      CENTRIFUGO_ADDRESS: "0.0.0.0"
      CENTRIFUGO_HTTP_API_INSECURE: "false"
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY:?CENTRIFUGO_TOKEN_HMAC_SECRET_KEY is required}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      valkey:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    networks: [devon]
